<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6f8">
  <title>ReNova</title>
  <style>
    :root { --edge: 28px; --ink: #59616b; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-snap-type: y proximity; }
    body { margin: 0; background: #edf0f3; overflow-x: hidden; }
    .progress { display: none; }
    main { padding: var(--edge) var(--edge) 44px; }
    .spread {
      width: min(100%, 1920px);
      min-height: calc(100vh - 72px);
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      scroll-snap-align: start;
      overflow: hidden;
      background: #f7f8f9;
      box-shadow: 0 14px 38px rgba(50, 60, 70, .08);
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .6s ease, transform .6s ease;
      position: relative;
    }
    .spread.is-visible { opacity: 1; transform: translateY(0); }
    .spread:first-child { opacity: 1; transform: none; }
    .spread img { display: block; width: 100%; height: auto; cursor: pointer; }
    .dot-glow {
      position: absolute;
      z-index: 1;
      width: 16px;
      height: 16px;
      border: 1px solid rgba(112, 122, 134, .7);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 0 rgba(174, 187, 199, .4), inset 0 0 5px rgba(255, 255, 255, .8);
      animation: dotBreathe 3.8s ease-in-out infinite;
    }
    .dot-glow::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,.6);
      animation: dotCore 3.8s ease-in-out infinite;
    }
    @keyframes dotBreathe {
      0%, 100% { opacity: .5; box-shadow: 0 0 0 0 rgba(174, 187, 199, .3), inset 0 0 5px rgba(255, 255, 255, .8); }
      50% { opacity: .95; box-shadow: 0 0 0 9px rgba(174, 187, 199, 0), inset 0 0 7px rgba(255, 255, 255, 1); }
    }
    @keyframes dotCore { 0%, 100% { transform: scale(.8); opacity: .45; } 50% { transform: scale(1); opacity: .9; } }
    .lightbox { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 28px; background: rgba(17, 22, 28, .9); opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility .45s ease; }
    .lightbox.open { opacity: 1; visibility: visible; }
    .lightbox img { max-width: 96vw; max-height: 92vh; width: auto; height: auto; object-fit: contain; cursor: zoom-out; border-radius: 4px; box-shadow: 0 18px 60px rgba(0,0,0,.35); transform: scale(.96); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
    .lightbox.open img { transform: scale(1); }
    .lightbox-close { position: absolute; top: 18px; right: 22px; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.35); border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; font: 22px/1 Arial,sans-serif; cursor: pointer; transition: background .2s ease, transform .2s ease; }
    .lightbox-close:hover { background: rgba(255,255,255,.24); transform: rotate(90deg); }
    .lightbox-close:focus-visible { outline: 3px solid #9aa7b3; outline-offset: 3px; }
    .controls { position: fixed; z-index: 4; right: 18px; bottom: 18px; display: flex; gap: 8px; }
    .controls a {
      width: 42px; height: 42px; display: grid; place-items: center;
      border: 1px solid rgba(89, 97, 107, .18); border-radius: 50%;
      background: rgba(255, 255, 255, .84); color: var(--ink); text-decoration: none;
      font: 24px/1 Arial, sans-serif; backdrop-filter: blur(10px);
      transition: transform .2s ease, background .2s ease;
    }
    .controls a:hover { background: #fff; transform: translateY(-2px); }
    .controls a:focus-visible { outline: 3px solid #9aa7b3; outline-offset: 3px; }
    @media (max-width: 700px) {
      :root { --edge: 10px; }
      main { padding-bottom: 18px; }
      .spread { min-height: auto; margin-bottom: 10px; }
      .controls { right: 12px; bottom: 12px; }
      .controls a { width: 38px; height: 38px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .spread { opacity: 1; transform: none; transition: none; }
      .dot-glow, .dot-glow::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="progress" aria-hidden="true"></div>
  <main>
    <section class="spread" id="page-1"><img src="renova-cover.png?v=2" alt="ReNova 重生上肢康复辅助机器人项目封面"></section>
    <section class="spread" id="page-2"><img src="renova-p1.png?v=2" alt="ReNova 问题与研究"></section>
    <section class="spread" id="page-3"><img src="renova-p2.png?v=2" alt="ReNova 情绪板与设计概念"></section>
    <section class="spread" id="page-4"><img src="renova-p3.png?v=2" alt="ReNova 交互与尺寸设计"></section>
    <section class="spread" id="page-5"><img src="renova-p4.png?v=2" alt="ReNova 产品细节与使用场景"></section>
  </main>
  <nav class="controls" aria-label="页面导航">
    <a href="#page-1" aria-label="回到第一页">↑</a>
    <a href="#page-5" aria-label="前往最后一页">↓</a>
  </nav>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
    <button class="lightbox-close" type="button" aria-label="Close preview">X</button>
    <img id="lightbox-image" alt="">
  </div>
  <script>
    const progress = document.querySelector('.progress');
    const updateProgress = () => {
      const range = document.documentElement.scrollHeight - innerHeight;
      progress.style.width = `${range ? scrollY / range * 100 : 0}%`;
    };
    addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => entry.isIntersecting && entry.target.classList.add('is-visible'));
      }, { threshold: 0.08 });
    document.querySelectorAll('.spread').forEach(page => observer.observe(page));
    }
    const dotPositions = [
      [48.5, 95.1],
      [48.5, 95.6],
      [48.5, 95.6],
      [53.1, 95.5]
    ];
    const dotGlows = [];
    document.querySelectorAll('.spread').forEach((page, index) => {
      if (index === 0) return;
      const glow = document.createElement('span');
      glow.className = 'dot-glow';
      glow.setAttribute('aria-hidden', 'true');
      page.append(glow);
      dotGlows.push({ page, image: page.querySelector('img'), glow, position: dotPositions[index - 1] });
    });
    const positionDotGlows = () => dotGlows.forEach(({ page, image, glow, position }) => {
      const [left, top] = position;
      glow.style.left = `${image.offsetLeft + image.offsetWidth * left / 100}px`;
      glow.style.top = `${image.offsetTop + image.offsetHeight * top / 100}px`;
    });
    addEventListener('resize', positionDotGlows, { passive: true });
    addEventListener('load', positionDotGlows);
    positionDotGlows();
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const closeButton = lightbox.querySelector('.lightbox-close');
    const closeLightbox = () => { lightbox.classList.remove('open'); document.body.style.overflow = ''; };
    document.querySelectorAll('.spread img').forEach(image => image.addEventListener('click', () => {
      lightboxImage.src = image.currentSrc || image.src;
      lightboxImage.alt = image.alt;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      closeButton.focus();
    }));
    closeButton.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', event => { if (event.target === lightbox) closeLightbox(); });
    addEventListener('keydown', event => { if (event.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox(); });
  </script>
</body>
</html>
